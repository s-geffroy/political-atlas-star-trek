# Aucun conteneur d'hebergement : le site est construit et heberge par
# GitHub Pages.
#
# appctl exige un compose.yaml pour toute application. Ce projet n'y declare
# qu'un outil de VERIFICATION, `pages-build` (profil cli, jamais lance par
# `up`), qui construit _site/ avec l'image du constructeur de GitHub Pages
# elle-meme. C'est le seul build local admis : un build avec une autre version
# de Jekyll ou des greffons libres donnerait un resultat different de ce qui
# sera publie -- deux verites au lieu d'une. Version d'image epinglee : la
# comparer a https://pages.github.com/versions.json en cas d'ecart.
#
# Si un jour ce projet a besoin d'un autre outil (un optimiseur d'images, un
# convertisseur), il se declare ici, sur demande explicite, avec son
# exposition dans app.yaml.
services:
  # Outil de VERIFICATION, pas d'hebergement : le constructeur officiel de
  # GitHub Pages (meme image, meme Jekyll 3.10, meme liste blanche que GitHub).
  # Il ne publie rien et n'expose rien ; profil cli, jamais lance par `up`.
  #   sudo appctl run pages-build   ->  _site/ (non versionne)
  # Ajoute a la demande de l'utilisateur (2026-11-10).
  pages-build:
    image: ghcr.io/actions/jekyll-build-pages:v1.0.13
    profiles: ["cli"]
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      INPUT_SOURCE: src
      INPUT_DESTINATION: src/_site
      INPUT_FUTURE: "false"
      INPUT_VERBOSE: "false"
      INPUT_BUILD_REVISION: local
      GITHUB_REPOSITORY: s-geffroy/political-atlas-star-trek
      PAGES_REPO_NWO: s-geffroy/political-atlas-star-trek
      JEKYLL_ENV: production
    networks: [political-atlas-star-trek-internal]
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  political-atlas-star-trek-internal:
    name: political-atlas-star-trek-internal
